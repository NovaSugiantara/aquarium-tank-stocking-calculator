<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aquarium Tank Stocking Calculator</title>
  <meta name="description" content="Check fish capacity with the one-inch-per-gallon rule." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='52'%3E🐠%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:oklch(96% .025 195);--surface:oklch(99% .008 195);--glass:oklch(87% .06 195);--ink:oklch(27% .065 190);--soft:oklch(51% .06 190);--accent:oklch(48% .105 205);--safe:oklch(59% .15 150);--warn:oklch(72% .15 82);--danger:oklch(58% .18 25);--border:oklch(91% .045 190);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--radius:16px;--display:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,sans-serif;--ease-out:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:radial-gradient(circle at 10% 0%,oklch(100% .01 195),transparent 34%),var(--bg);color:var(--ink);font-family:var(--body);min-width:320px}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-6);padding:var(--space-12) 0 var(--space-8)}.eyebrow{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1,h2,h3,.number,.status-name{font-family:var(--display);margin:0}h1{font-size:clamp(28px,4vw,44px);line-height:1;max-width:560px;overflow-wrap:anywhere;min-width:0}.lede{margin:var(--space-3) 0 0;color:var(--soft);font-size:15px;line-height:1.55;max-width:480px}.rule{font:500 12px var(--display);color:var(--soft);white-space:nowrap;padding-top:3px}.workspace{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);gap:var(--space-6);padding-bottom:var(--space-12)}.panel{background:color-mix(in oklch,var(--surface) 88%,transparent);border:1.5px solid var(--glass);border-radius:var(--radius);box-shadow:0 18px 48px oklch(35% .06 190/.08);backdrop-filter:blur(12px)}.form-panel{padding:var(--space-8)}.panel-head{display:flex;justify-content:space-between;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-8)}.panel-title{font-size:22px}.panel-note{font-size:12px;color:var(--soft)}label{display:block;font:600 13px var(--body);margin-bottom:var(--space-2)}.field{margin-bottom:var(--space-6)}input,select,button{font:inherit}input,select{width:100%;border:1px solid var(--glass);border-radius:10px;background:var(--surface);color:var(--ink);min-height:48px;padding:0 var(--space-4);outline:none}input{font:700 24px var(--display)}select{font-size:14px}input:focus-visible,select:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px oklch(48% .105 205/.18)}.hint,.error{font-size:12px;line-height:1.45;margin:var(--space-2) 0 0}.hint{color:var(--soft)}.error{color:var(--danger);font-weight:600}.form-actions{display:flex;gap:var(--space-3);align-items:center}button{border:0;border-radius:10px;min-height:44px;padding:0 var(--space-4);cursor:pointer;transition:transform .18s var(--ease-out),background-color .18s var(--ease-out),opacity .18s}.primary{background:var(--accent);color:white;font-weight:700;flex:1}.secondary{background:transparent;color:var(--accent);border:1px solid var(--glass);font-weight:600}.primary:hover,.secondary:hover{transform:translateY(-2px)}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid oklch(72% .15 82);outline-offset:2px}button:disabled{cursor:not-allowed;background:oklch(85% .03 195);color:var(--soft);border-color:transparent;opacity:1}.status-panel{padding:var(--space-8);position:relative;overflow:hidden}.status-panel.safe{border-color:oklch(80% .1 150)}.status-panel.getting-full{border-color:oklch(86% .12 82)}.status-panel.overcrowded{border-color:oklch(80% .12 25)}.status-top{display:flex;align-items:end;justify-content:space-between;gap:var(--space-4)}.metric-label{color:var(--soft);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}.number{font-size:clamp(42px,7vw,72px);line-height:.9;letter-spacing:-.06em}.number small{font:600 16px var(--body);letter-spacing:0;color:var(--soft)}.status-name{font-size:18px;font-weight:700}.status-copy{color:var(--soft);font-size:13px;margin-top:var(--space-1)}.status-mark{font-size:34px}.water{height:84px;margin:var(--space-8) 0 var(--space-6);border:1px solid var(--glass);border-radius:12px;position:relative;overflow:hidden;background:oklch(94% .035 195)}.water-fill{height:100%;width:0;max-width:100%;transition:width .3s var(--ease-out),background-color .3s var(--ease-out);position:relative;background:var(--safe)}.water-fill:after{content:"";position:absolute;left:-5%;right:-5%;top:-9px;height:18px;background:inherit;border-radius:50%;filter:brightness(1.12);animation:surface 4s ease-in-out infinite}.water-fill.getting-full{background:var(--warn)}.water-fill.overcrowded{background:var(--danger)}.water-scale{display:flex;justify-content:space-between;color:var(--soft);font-size:11px;margin-top:-20px;position:relative;padding:0 var(--space-2)}.water-copy{font:600 12px var(--body);color:var(--soft);margin-top:var(--space-6)}.status-empty{color:var(--soft);padding:var(--space-8) 0}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);border-top:1px solid var(--border);padding-top:var(--space-6);margin-top:var(--space-6)}.summary strong{display:block;font:700 22px var(--display)}.summary span{font-size:12px;color:var(--soft)}.list-panel{grid-column:1/-1;padding:var(--space-8)}.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)}.list-head h2{font-size:22px}.fish-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}.fish{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border:1px solid var(--border);border-radius:12px;background:var(--surface);transition:transform .18s var(--ease-out),opacity .18s}.fish:hover{transform:translateY(-2px)}.fish-emoji{font-size:25px}.fish-name{font:600 14px var(--display);flex:1;min-width:0}.fish-meta{display:block;font:500 12px var(--body);color:var(--soft);margin-top:2px}.remove{min-width:36px;padding:0;color:var(--danger);background:transparent;font-size:18px}.empty{text-align:center;border:1px dashed var(--glass);border-radius:12px;padding:var(--space-8);color:var(--soft);grid-column:1/-1}.empty-icon{display:block;font-size:42px;margin-bottom:var(--space-3)}.empty strong{display:block;color:var(--ink);font:700 18px var(--display)}.empty p{font-size:13px;margin:var(--space-2) auto 0;max-width:360px}.error-state{padding:var(--space-6);border:1px solid var(--danger);background:oklch(97% .025 25);border-radius:var(--radius);color:var(--danger);margin-bottom:var(--space-6)}.error-state button{margin-top:var(--space-3);background:var(--danger);color:white}.loading{min-height:120px;background:linear-gradient(90deg,transparent,oklch(100% .01 195/.7),transparent);background-size:200% 100%;animation:shimmer 1.1s linear infinite;border-radius:10px}.toast{position:fixed;right:16px;bottom:16px;display:flex;gap:var(--space-3);align-items:center;background:var(--ink);color:white;border-radius:10px;padding:var(--space-3) var(--space-3) var(--space-3) var(--space-4);font-size:13px;box-shadow:0 12px 30px oklch(20% .05 190/.2);z-index:2}.toast button{min-height:34px;background:var(--warn);color:var(--ink);padding:0 var(--space-3)}[hidden]{display:none!important}@keyframes surface{50%{transform:translateX(3%)}}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:700px){.topbar{padding:var(--space-8) 0 var(--space-6)}.rule{white-space:normal;text-align:right}.workspace{grid-template-columns:1fr}.form-panel,.status-panel,.list-panel{padding:var(--space-6)}.fish-list{grid-template-columns:1fr}}@media(max-width:320px){.shell{width:calc(100% - 24px)}.topbar{display:block}.rule{text-align:left;margin-top:var(--space-3)}.summary{grid-template-columns:1fr 1fr}.summary div:last-child{grid-column:1/-1}.toast{left:12px;right:12px;bottom:12px;justify-content:space-between}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    .list-panel.overcrowded{border-color:var(--danger)}
    :root{--bubble:oklch(100% .01 195/.75)}
    .water:before{content:"";position:absolute;z-index:2;left:14%;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--bubble);box-shadow:34px 15px 0 1px var(--bubble),72px 5px 0 -1px var(--bubble),108px 22px 0 1px var(--bubble);opacity:.7;animation:bubbles 5s var(--ease-out) infinite}
    @keyframes bubbles{50%{transform:translateY(-32px);opacity:.18}}
  </style>
</head>
<body>
  <main class="shell" id="app">
    <header class="topbar"><div><div class="eyebrow">Freshwater setup tool</div><h1>Know your tank before you stock it.</h1><p class="lede">Add fish one at a time. This calculator checks the classic 1 inch of fish per gallon rule as you go.</p></div><div class="rule">1 in fish<br />per gallon</div></header>
    <div id="error-state" class="error-state" hidden role="alert"></div>
    <section id="loading-state" class="panel loading" aria-label="Loading calculator"></section>
    <div id="workspace" class="workspace" hidden>
      <section id="fish-form" class="panel form-panel" aria-labelledby="form-title"></section>
      <section id="status-panel" class="panel status-panel" aria-labelledby="status-title" aria-live="polite"></section>
      <section id="fish-list" class="panel list-panel" aria-labelledby="list-title"></section>
    </div>
    <div id="toast" class="toast" hidden role="status"></div>
  </main>
  <noscript><p class="error-state">JavaScript diperlukan untuk menghitung kapasitas tank.</p></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
